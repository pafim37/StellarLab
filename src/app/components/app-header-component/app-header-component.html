<mat-toolbar class="header">
  <div class="brand">
    <h1>Stellar Lab</h1>
    <span>Explore the evolution of the universe</span>
  </div>

  <nav class="actions" aria-label="Main navigation">
    <a mat-button routerLink="">Home</a>
    <a mat-button routerLink="stars">Stars</a>
    <a mat-button routerLink="about">About</a>

    <mat-button-toggle-group
      class="theme-toggle"
      [value]="themeMode()"
      (change)="setThemeMode($event.value)"
      aria-label="Theme mode"
    >
      <mat-button-toggle value="light">Light</mat-button-toggle>
      <mat-button-toggle value="dark">Dark</mat-button-toggle>
    </mat-button-toggle-group>
  </nav>
</mat-toolbar>
